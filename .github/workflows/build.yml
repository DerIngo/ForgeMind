name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Smoke-test executable JAR
        shell: bash
        run: |
          output=$(java -jar forgemind-cli/target/forgemind-cli-*-all.jar)
          test "$output" = 'Hello World!'
